<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVID'S LUXE ESTATES | CEO</title>
<link rel="icon" href="https://i.postimg.cc/CLMJtTHL/logo.png">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:#000; color:#fff; font-family: 'Segoe UI', sans-serif; position:relative; min-height:100vh; }

  /* 1. LOGO AS FULL PAGE BACKGROUND */
  .page-bg-logo {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:1000px;
    opacity:0.04; /* faint watermark */
    z-index:0;
    pointer-events:none;
  }

  /* 2. CONTENT ON TOP */
  .content { position:relative; z-index:2; }

  nav { position:fixed; top:0; width:100%; background:rgba(0,0,0,0.9); border-bottom:1px solid #D4AF37; z-index:1000; padding:18px; display:flex; justify-content:center; gap:40px; }
  nav a { color:#D4AF37; text-decoration:none; font-weight:800; font-size:14px; letter-spacing:2px; }
  nav a:hover { transform:scale(1.1); }

  .section { min-height:100vh; padding:120px 20px 80px; max-width:900px; margin:0 auto; text-align:center; }
  .section-title { font-size:42px; color:#D4AF37; margin-bottom:30px; letter-spacing:3px; }

  /* 3. ABOUT ME */
  .about-img {
    width:300px;
    height:300px;
    border-radius:50%;
    border:4px solid #D4AF37;
    object-fit:cover;
    margin:0 auto 30px;
    box-shadow:0 0 40px rgba(212,175,55,0.4);
  }
  .about-text { font-size:17px; line-height:1.8; color:#ddd; margin-bottom:40px; }

  /* 4. CONTACT */
  .contact-box { background:#111; border:1px solid #D4AF37; border-radius:16px; padding:40px 30px; }
  .contact-item { font-size:18px; margin:15px 0; color:#ccc; }
  .wa-btn { 
    display:inline-block; 
    background:#25D366; 
    color:#fff; 
    padding:18px 45px; 
    border-radius:50px; 
    text-decoration:none; 
    font-weight:800; 
    font-size:16px; 
    margin-top:20px;
    transition:0.3s;
  }
  .wa-btn:hover { transform:scale(1.05); box-shadow:0 0 25px rgba(37,211,102,0.6); }

  .footer { text-align:center; padding:30px; color:#666; font-size:12px; border-top:1px solid #222; }
</style>
</head>
<body>

<!-- LOGO BACKGROUND WATERMARK -->
<img src="https://i.postimg.cc/CLMJtTHL/logo.png" class="page-bg-logo" alt="">

<div class="content">
<nav>
  <a href="#home">HOME</a>
  <a href="#about">ABOUT ME</a>
  <a href="#contact">CONTACT</a>
</nav>

<!-- PAGE 1: HOME -->
<div id="home" class="section">
  <h1 class="section-title">DAVID'S LUXE ESTATES</h1>
  <p style="font-size:20px; color:#aaa; letter-spacing:2px;">LIVE • INVEST • PROSPER</p>
  <p style="margin-top:40px; color:#888;">Luxury Real Estate in Lagos & London</p>
</div>
