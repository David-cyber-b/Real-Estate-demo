<title>DAVIDS LUXE ESTATE</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    background:#0a0a0a; /* Slightly lighter black */
    color:#fff; 
    font-family: 'Segoe UI', sans-serif; 
    position:relative; 
    overflow-x:hidden;
  }

  /* BRIGHTER + FULL COVER LOGO BACKGROUND */
  .page-bg-logo {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:120vw;
    height:120vh;
    max-width:none;
    object-fit:cover;
    opacity:0.22; /* 2X BRIGHTER */
    z-index:0;
    pointer-events:none;
    filter: brightness(1.6) drop-shadow(0 0 50px rgba(212,175,55,0.4));
  }

  .container { position:relative; z-index:2; max-width:800px; margin:0 auto; padding:60px 20px; text-align:center; }
  .section-title { font-size:44px; color:#D4AF37; margin-bottom:40px; letter-spacing:4px; font-weight:700; text-shadow:0 0 25px rgba(212,175,55,0.4); }
  
  .about-img {
    width:300px; height:300px; border-radius:50%;
    border:4px solid #D4AF37; object-fit:cover;
    margin:0 auto 35px; display:block;
    box-shadow:0 0 50px rgba(212,175,55,0.5);
  }
  
  .about-text { font-size:18px; line-height:1.9; color:#eee; margin-bottom:50px; max-width:650px; margin-left:auto; margin-right:auto; }
  
  .contact-box { 
    background:rgba(18,18,18,0.9); border:2px solid #D4AF37; 
    border-radius:20px; padding:50px 30px; max-width:500px; margin:0 auto;
  }
  
  .contact-item { font-size:18px; margin:20px 0; color:#ddd; }
  .wa-btn { 
    display:inline-block; background:linear-gradient(45deg, #25D366, #1EBE57); color:#fff; 
    padding:20px 55px; border-radius:50px; text-decoration:none; 
    font-weight:800; font-size:18px; margin-top:30px;
  }
  .footer { text-align:center; padding:40px 20px; color:#555; font-size:13px; border-top:1px solid #222; margin-top:60px; }
</style>
</head>
